[package]
name = "open-computer-desktop"
version = "0.1.0"
edition = "2024"
default-run = "open-computer"
license = "MIT"
publish = false

[workspace]
members = ["crates/shell-core"]
resolver = "3"

[[bin]]
name = "open-computer"
path = "src/main.rs"

# Shipped executables carry no symbol table.
[profile.release]
strip = true

[dependencies]
shell-core = { path = "crates/shell-core" }
color-eyre = "0.6.5"
serde_json = "1.0.151"
# Same pinned Rune revision as Hex.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "c8f2888e768dc41747e1b8656b06631b8c47fdab" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "c8f2888e768dc41747e1b8656b06631b8c47fdab" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "c8f2888e768dc41747e1b8656b06631b8c47fdab" }

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "forbid"

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
todo = "warn"
# shared-lints end
expect_used = "warn"
unwrap_used = "warn"

[lints]
workspace = true
