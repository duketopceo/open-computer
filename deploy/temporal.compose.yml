# open-computer Temporal stack — durable workflow backend for U15/Khan adapter.
# Loopback-only binds: nothing reaches the LAN. Data is real (pgdata volume),
# not disposable — workflows hold run state.
name: oc-temporal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD:?deploy/temporal.env required}
      POSTGRES_DB: temporal
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  temporal:
    image: temporalio/auto-setup:1.23.1.1
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:7233:7233"]
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:?}
      ENABLE_ES: "false"
      TEMPORAL_ADDRESS: 127.0.0.1:7233
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    depends_on:
      temporal: {condition: service_started}
    ports: ["127.0.0.1:8233:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8233
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  pgdata:
