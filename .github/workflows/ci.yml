name: ci

# pull_request, never pull_request_target: PR code runs with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, pytest not live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: ruff
        run: uv run --locked ruff check .
      # Live rows (marker `live`) boot real CubeSandbox microVMs and are excluded here. R1-R3 are covered
      # in CI by tests/unit/test_execplane_adapter.py against a fake SDK.
      - name: pytest (conformance, fsproto, opsview, unit)
        run: uv run --locked pytest -m "not live" -p no:cacheprovider

  console-e2e:
    name: console e2e (playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      - name: install playwright + axe (lockfile)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: console e2e (fixture data only, no microVMs, no models, loopback)
        working-directory: tests/e2e
        env:
          OC_PYTHON: uv run --locked python
        run: npm test
