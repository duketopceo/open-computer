name: ci

# pull_request, never pull_request_target: PR code runs with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deploy controller requires these gate job names verbatim (not deploy *).
jobs:
  python:
    name: python (ruff, pytest not live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: uv run --locked ruff check .
      # Live rows (marker `live`) boot real CubeSandbox microVMs and are excluded here. R1-R3 are covered
      # in CI by tests/unit/test_execplane_adapter.py against a fake SDK.
      - name: pytest (conformance, fsproto, opsview, unit)
        run: uv run --locked pytest -m "not live" -p no:cacheprovider

  # The image install runs before any sandbox exists, so a modified registry artifact would execute with host
  # privilege. The tests below install the exact committed file with real pip into a throwaway venv (proving a
  # removed hash fails) and prove the file still matches uv.lock. Both live in
  # tests/unit/test_provisioning_pins.py rather than as a second copy of the commands here.
  # This does not replace `uv sync` in the job above: requirements.txt is the runtime export and deliberately
  # excludes pytest and ruff.
  provisioning:
    name: provisioning (hash-verified install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the same uv as the Dockerfile so `uv export` is byte-stable for the freshness check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: requirements.txt matches uv.lock, and every hash verifies
        run: uv run --with pytest pytest tests/unit/test_provisioning_pins.py -p no:cacheprovider

  console-e2e:
    name: console e2e (playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      # `/` serves the React front door from ui/dist; build it so e2e covers the real SPA.
      - name: build ui (pnpm via corepack, frozen lockfile)
        working-directory: ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm build:demo
          pnpm check:demo
      - name: install playwright + axe (lockfile)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: console e2e (fixture data only, no microVMs, no models, loopback)
        working-directory: tests/e2e
        env:
          OC_PYTHON: uv run --locked python
        run: npm test

  production-approval:
    name: production approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, console-e2e, provisioning]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Record approved commit
        run: echo "Approved commit $GITHUB_SHA for production"

  # Post-gate production deploy to server-001 over SSH (same pattern as kurultai's
  # deploy-server-001.yml). Runs on a GitHub-hosted runner, push-to-main only (job-level
  # `if`), after `production-approval` (the `production` environment review). No
  # self-hosted runner exists and no pull_request job can reach the secrets. The host
  # fetches the exact merged SHA, then runs the checkout's own redeploy script
  # (build, backup, swap, health check, rollback on failure).
  deploy:
    name: deploy (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-approval]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: oc-server-001-deploy
      cancel-in-progress: false
    steps:
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.OC_DEPLOY_HOST }}
          KEY: ${{ secrets.OC_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Missing OC_DEPLOY_HOST / OC_DEPLOY_SSH_KEY (production environment or repo secrets)"
            exit 1
          fi
      - name: SSH deploy exact merged SHA
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.OC_DEPLOY_HOST }}
          username: ${{ secrets.OC_DEPLOY_USER || 'khan' }}
          key: ${{ secrets.OC_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.OC_DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha" >&2; exit 1; }
            cd "${OC_DEPLOY_DIR:-$HOME/open-computer}"
            git fetch -q origin main
            head="$(git rev-parse origin/main)"
            if [ "$head" != "$DEPLOY_SHA" ] && git merge-base --is-ancestor "$DEPLOY_SHA" "$head"; then
              echo "main advanced to $head; skipping stale $DEPLOY_SHA"
              exit 0
            fi
            git checkout -q --detach "$DEPLOY_SHA"
            exec deploy/server-001/redeploy.sh "$DEPLOY_SHA"
