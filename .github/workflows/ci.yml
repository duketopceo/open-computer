name: ci

# pull_request, never pull_request_target: PR code runs with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# `shell: bash` makes GitHub run bash -eo pipefail, so a failure inside a pipe fails the step (a plain `bash -e`
# only sees the last command of a pipe). scripts/check-workflow-pipe-masking.sh relies on this.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deploy controller requires these gate job names verbatim (not deploy *).
jobs:
  python:
    name: python (ruff, pytest not live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: uv run --locked ruff check .
      # Encoded lessons (docs/runbooks/encoded-lessons.md): every repeated correction is a mechanical check. They run
      # after lint and before the tests. The wizard freshness guard needs the diagnostics package's dependencies only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('core/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: install the diagnostics package dependencies (frozen lockfile)
        working-directory: core
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter "@open-computer/diagnostics..."
      - name: Encoded lesson guards
        run: make lint-lessons
      # Live rows (marker `live`) boot real CubeSandbox microVMs and are excluded here. R1-R3 are covered
      # in CI by tests/unit/test_execplane_adapter.py against a fake SDK.
      - name: pytest (conformance, fsproto, opsview, unit)
        run: uv run --locked pytest -m "not live" -p no:cacheprovider

  # The image install runs before any sandbox exists, so a modified registry artifact would execute with host
  # privilege. The tests below install the exact committed file with real pip into a throwaway venv (proving a
  # removed hash fails) and prove the file still matches uv.lock. Both live in
  # tests/unit/test_provisioning_pins.py rather than as a second copy of the commands here.
  # This does not replace `uv sync` in the job above: requirements.txt is the runtime export and deliberately
  # excludes pytest and ruff.
  provisioning:
    name: provisioning (hash-verified install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the same uv as the Dockerfile so `uv export` is byte-stable for the freshness check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: requirements.txt matches uv.lock, and every hash verifies
        run: uv run --with pytest pytest tests/unit/test_provisioning_pins.py -p no:cacheprovider

  # v1 core (TypeScript). Nothing here deploys or contacts Cloudflare: the Worker runs under miniflare, and the
  # bundle check is `wrangler deploy --dry-run`. Like every job here they are gates: both names are registered in
  # deploy/approved_deploy.py REQUIRED_JOBS and listed in production-approval's `needs`.
  core:
    name: core (typecheck, tests, sidecar build, bundle dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install (pnpm via corepack, frozen lockfile)
        working-directory: core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: core
        run: pnpm typecheck
      - name: tests (agent-core, local under Node; cloud under miniflare; no network, no real models)
        working-directory: core
        run: pnpm test
      - name: sidecar build and smoke check
        working-directory: core
        run: pnpm --filter @open-computer/local build
      - name: cloud bundle dry run (never a real deploy)
        working-directory: core
        run: pnpm --filter @open-computer/cloud exec wrangler deploy --dry-run --outdir dist
      - name: event schema file is up to date
        working-directory: core/packages/agent-core
        run: node scripts/gen-schema.ts --check
      - name: web setup wizard page is up to date
        working-directory: core
        run: pnpm --filter @open-computer/diagnostics check:wizard
      - name: no purple, violet or indigo in product colours
        run: node scripts/check-no-purple.mjs

  # The self-hosted install script, run for real on the runner (no containers, no VMs): install the compiled core as a
  # systemd service under the hardened unit, then run the wizard chain against the daemon. The sandbox is the CI-only
  # stub and the OpenRouter rows are skipped, because CI has no model key and no live models.
  self-host:
    name: self-host (install script on the runner, wizard chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: build the core binary
        working-directory: core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @open-computer/local build
      - name: install with the script
        run: sudo bash deploy/self-host/install.sh --bin core/packages/local/out/oc-core --sandbox stub --port 8787
      - name: wait for the service
        run: |
          for _ in $(seq 30); do
            [ "$(systemctl is-active open-computer-core)" = active ] && curl -sS -o /dev/null http://127.0.0.1:8787/v1/health && break
            sleep 1
          done
          systemctl is-active open-computer-core
      - name: wizard chain against the daemon
        env:
          OC_CLOUD_URL: http://127.0.0.1:8787
        run: |
          OC_CLOUD_TOKEN="$(sudo cat /etc/open-computer/token)" node core/packages/diagnostics/src/cli.ts doctor --backend self-hosted --skip-model --json "$RUNNER_TEMP/self-host-results.json"
      - name: rejects a missing token and survives a restart
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/health)" = 401
          sudo systemctl restart open-computer-core
          sleep 2
          curl -fsS -H "authorization: Bearer $(sudo cat /etc/open-computer/token)" http://127.0.0.1:8787/v1/health
      - name: service log on failure
        if: failure()
        run: sudo journalctl -u open-computer-core --no-pager -n 50

  desktop:
    name: desktop (fmt, clippy, tests, sidecar e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rune builds a windowing and GPU stack; these are the Linux libraries it and the keyring need.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-x11-dev libvulkan-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: fmt
        working-directory: desktop
        run: cargo fmt --check
      - name: clippy
        working-directory: desktop
        run: cargo clippy --workspace -- -D warnings
      - name: shell-core tests (no display, no GPU)
        working-directory: desktop
        run: cargo test -p shell-core
      - name: desktop tests (headless rune, no display)
        working-directory: desktop
        run: cargo test -p open-computer-desktop
      - name: build check
        working-directory: desktop
        run: cargo check --workspace
      - name: headless onboarding state
        working-directory: desktop
        run: cargo run -q -- --print-state | python3 -c "import json,sys; json.load(sys.stdin)"
      # The contract fixtures catch shape drift; this proves the Rust client against the real compiled sidecar.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: build the sidecar
        working-directory: core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @open-computer/local build
      - name: sidecar e2e
        working-directory: desktop
        env:
          OC_CORE_BIN: ${{ github.workspace }}/core/packages/local/out/oc-core
        run: cargo test -p shell-core --test e2e -- --ignored
      # The real opencode and hermes-agent programs, driven through the desktop adapter, and the real wrangler signed out.
      # No key, no account, no spend: each agent talks to desktop/scripts/fake_openai.py on loopback. Versions are pinned.
      # (A step here, not a new job, so the production gate list does not change.)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: opencode-ai 1.19.5 (npm)
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          cd "$RUNNER_TEMP/opencode"
          npm init -y >/dev/null
          npm install opencode-ai@1.19.5 --no-audit --no-fund
          (cd node_modules/opencode-ai && node postinstall.mjs)
          "$PWD/node_modules/.bin/opencode" --version
          echo "OC_OPENCODE_BIN=$PWD/node_modules/.bin/opencode" >> "$GITHUB_ENV"
      - name: hermes-agent 0.19.0 (PyPI, Nous Research)
        run: |
          uv venv "$RUNNER_TEMP/hermes"
          uv pip install --python "$RUNNER_TEMP/hermes/bin/python" "hermes-agent==0.19.0"
          "$RUNNER_TEMP/hermes/bin/hermes" --version
          echo "OC_HERMES_BIN=$RUNNER_TEMP/hermes/bin/hermes" >> "$GITHUB_ENV"
      - name: real binaries through the adapter (text, tool call, error, Stop) and wrangler signed out
        env:
          OC_WRANGLER_CMD: ${{ github.workspace }}/core/packages/cloud/node_modules/.bin/wrangler
        run: bash desktop/scripts/real_harness_check.sh

  console-e2e:
    name: console e2e (playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      # `/` serves the React front door from ui/dist; build it so e2e covers the real SPA.
      - name: build ui (pnpm via corepack, frozen lockfile)
        working-directory: ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm build:demo
          pnpm check:demo
      - name: install playwright + axe (lockfile)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: console e2e (fixture data only, no microVMs, no models, loopback)
        working-directory: tests/e2e
        env:
          OC_PYTHON: uv run --locked python
        run: npm test

  production-approval:
    name: production approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, console-e2e, provisioning, core, self-host, desktop]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Record approved commit
        run: echo "Approved commit $GITHUB_SHA for production"

  # Post-gate production deploy to server-001 over SSH (same pattern as kurultai's
  # deploy-server-001.yml). Runs on a GitHub-hosted runner, push-to-main only (job-level
  # `if`), after `production-approval` (the `production` environment review). No
  # self-hosted runner exists and no pull_request job can reach the secrets. The host
  # fetches the exact merged SHA, then runs the checkout's own redeploy script
  # (build, backup, swap, health check, rollback on failure).
  deploy:
    name: deploy (production)
    # Retired: the Python stack on the server is replaced by the Cloudflare core (docs/runbooks/legacy-server-stack.md).
    # The job only runs when the repository variable OC_LEGACY_DEPLOY is set to 'true', so it can be revived by
    # setting a variable, not by editing the workflow.
    if: vars.OC_LEGACY_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-approval]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: oc-server-001-deploy
      cancel-in-progress: false
    steps:
      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.OC_DEPLOY_HOST }}
          KEY: ${{ secrets.OC_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Missing OC_DEPLOY_HOST / OC_DEPLOY_SSH_KEY (production environment or repo secrets)"
            exit 1
          fi
      - name: SSH deploy exact merged SHA
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.OC_DEPLOY_HOST }}
          username: ${{ secrets.OC_DEPLOY_USER || 'khan' }}
          key: ${{ secrets.OC_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.OC_DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha" >&2; exit 1; }
            cd "${OC_DEPLOY_DIR:-$HOME/open-computer}"
            git fetch -q origin main
            head="$(git rev-parse origin/main)"
            if [ "$head" != "$DEPLOY_SHA" ] && git merge-base --is-ancestor "$DEPLOY_SHA" "$head"; then
              echo "main advanced to $head; skipping stale $DEPLOY_SHA"
              exit 0
            fi
            git checkout -q --detach "$DEPLOY_SHA"
            exec deploy/server-001/redeploy.sh "$DEPLOY_SHA"

  # Post-gate production deploy of the Cloudflare core, after `production-approval` (the `production` environment
  # review). It uses the deploy-as-code path the wizard uses (`oc setup`): provision what is missing, render
  # wrangler.deploy.jsonc from the committed wrangler.jsonc, apply D1 migrations, `wrangler deploy`, then the full
  # diagnostics chain against the deployed core. Any red row fails the job. The model rows are skipped (no key in CI,
  # no spend). Skipped with a notice until the secrets below exist; see docs/runbooks/core-deploy-ci.md.
  # Its name starts with "deploy " so it stays a post-gate job, out of REQUIRED_JOBS (tests/unit/test_approved_deploy.py).
  deploy-core:
    name: deploy core (cloudflare)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-approval]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: oc-core-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OC_CLOUD_TOKEN: ${{ secrets.OC_CLOUD_TOKEN }}
      OC_AI_GATEWAY_ID: ${{ vars.OC_AI_GATEWAY_ID }}
    steps:
      # Names only: no value is ever echoed.
      - name: Check the deploy is configured
        id: guard
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret:CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secret:CLOUDFLARE_ACCOUNT_ID"
          [ -n "$OC_CLOUD_TOKEN" ] || missing="$missing secret:OC_CLOUD_TOKEN"
          [ -n "$OC_AI_GATEWAY_ID" ] || missing="$missing variable:OC_AI_GATEWAY_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Core deploy skipped::Not configured, missing:$missing. Add them under Settings > Secrets and variables > Actions (see docs/runbooks/core-deploy-ci.md). The core was not deployed."
            echo "Core deploy skipped, missing:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: "24"
      - name: pnpm store cache
        if: steps.guard.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('core/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: install (pnpm via corepack, frozen lockfile)
        if: steps.guard.outputs.ready == 'true'
        working-directory: core
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # `setup` is idempotent: it finds or creates the D1 database, R2 bucket and Secrets Store entries, applies
      # migrations, runs `wrangler deploy -c wrangler.deploy.jsonc` and stores the core address. The OpenRouter key
      # must already be in the account's Secrets Store (the owner's first local `oc setup` put it there); CI never
      # holds it. Docker on the runner builds the sandbox image.
      - name: deploy (oc setup, deploy-as-code)
        if: steps.guard.outputs.ready == 'true'
        working-directory: core/packages/diagnostics
        run: node src/cli.ts setup --skip-model --json "$RUNNER_TEMP/core-deploy-setup.json"
      # The gate: the diagnostics chain against the deployed core. Exit 1 on any failed or skipped row.
      - name: diagnostics against the deployed core (any red row fails)
        if: steps.guard.outputs.ready == 'true'
        working-directory: core/packages/diagnostics
        run: node src/cli.ts doctor --skip-model --json "$RUNNER_TEMP/core-deploy-doctor.json"
      - name: keep the results
        if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-deploy-results
          path: |
            ${{ runner.temp }}/core-deploy-setup.json
            ${{ runner.temp }}/core-deploy-doctor.json
          if-no-files-found: ignore
          retention-days: 30
