name: ci

# pull_request, never pull_request_target: PR code runs with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deploy controller requires these gate job names verbatim (not deploy *).
jobs:
  python:
    name: python (ruff, pytest not live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: uv run --locked ruff check .
      # Live rows (marker `live`) boot real CubeSandbox microVMs and are excluded here. R1-R3 are covered
      # in CI by tests/unit/test_execplane_adapter.py against a fake SDK.
      - name: pytest (conformance, fsproto, opsview, unit)
        run: uv run --locked pytest -m "not live" -p no:cacheprovider

  console-e2e:
    name: console e2e (playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      # `/` serves the React front door from ui/dist; build it so e2e covers the real SPA.
      - name: build ui (pnpm via corepack, frozen lockfile)
        working-directory: ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm build:demo
          pnpm check:demo
      - name: install playwright + axe (lockfile)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: console e2e (fixture data only, no microVMs, no models, loopback)
        working-directory: tests/e2e
        env:
          OC_PYTHON: uv run --locked python
        run: npm test

  production-approval:
    name: production approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, console-e2e]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Record approved commit
        run: echo "Approved commit $GITHUB_SHA for production"

  # Post-gate production deploy on a self-hosted runner labeled
  # [self-hosted, linux, oc-deploy]. Push-to-main only (job-level `if`, never
  # pull_request): no PR job may target that label. Checks out no workflow
  # code; runs the host's own ~/bin/oc-deploy with the exact merged SHA.
  # Gated by the `production` environment via `needs: [production-approval]`.
  deploy:
    name: deploy (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-approval]
    runs-on: [self-hosted, linux, oc-deploy]
    timeout-minutes: 20
    permissions: {}
    concurrency:
      group: oc-deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy exact merged SHA
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha" >&2; exit 1; }
          # Production worktree (not a developer checkout). Fetch-only: never
          # mutates the tracked tree; oc-deploy owns the checkout.
          src="${OC_DEPLOY_DIR:-$HOME/.local/share/oc/deploy}"
          git -C "$src" fetch -q origin main
          head="$(git -C "$src" rev-parse origin/main)"
          if [ "$head" != "$DEPLOY_SHA" ] && git -C "$src" merge-base --is-ancestor "$DEPLOY_SHA" "$head"; then
            echo "main advanced to $head; skipping stale $DEPLOY_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Deploying \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if "$HOME/bin/oc-deploy" "$DEPLOY_SHA"; then
            echo "Result: live (health check passed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Result: FAILED health check; oc-deploy rolled back" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
