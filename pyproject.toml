[project]
name = "open-computer"
version = "0.0.0"
description = "Self-hosted, cost-capped control plane: routed workers in disposable sandboxes, approval-gated egress."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fido2>=2.0",
  "openrouter==1.3.138",
  # Context compaction for long chats (MIT, stdlib only). Pinned to a reviewed commit.
  "jev-compact @ git+https://github.com/duketopceo/jev-compact@fe1cde259805320e78643835c9c31f9f0943c736",
  "composio>=0.10",
]

[project.optional-dependencies]
# SPACE backend: ECW control plane via the e2b SDK (S7). The adapter
# degrades to sandboxes_available()=False without it — never required.
space = [
  "e2b==2.21.1",
]
# Durable schedules (Temporal). The image installs this extra so the worker and
# the relay are hash-verified with everything else; the code still treats the
# import as optional (services/opsview/goalruns.py), so a checkout without it runs.
durable = [
  "temporalio==1.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests/conformance", "tests/fsproto", "tests/opsview", "tests/unit", "tests/mcp"]
addopts = "-ra"
markers = [
  "live: boots real CubeSandbox microVMs; excluded from CI (`-m 'not live'`), run by hand",
  "slow: runs a real package install (resolves ~60 packages); excluded from the default run",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bench", ".agentflow"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]
